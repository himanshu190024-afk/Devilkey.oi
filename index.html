<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEVIL KEY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #250000 0%, #090000 45%, #000 100%);
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            width: 90%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;
            background: rgba(15,0,0,.95);
            border: 1px solid #f00;
            border-radius: 18px;
            box-shadow: 0 0 15px #f00, 0 0 40px rgba(255,0,0,.4);
        }
        .devil { font-size: 55px; margin-bottom: 10px; filter: drop-shadow(0 0 12px red); }
        h1 {
            color: #ff1a1a;
            font-size: 30px;
            letter-spacing: 5px;
            text-shadow: 0 0 12px red;
            margin-bottom: 25px;
        }
        .key-box {
            padding: 16px;
            background: #050505;
            border: 1px solid #550000;
            border-radius: 10px;
            color: #ff4d4d;
            font-size: 14px;
            word-break: break-all;
            box-shadow: inset 0 0 15px rgba(255,0,0,.25);
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b0000, #f00);
            color: white;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,0,0,.6);
            transition: .2s;
        }
        button:hover { transform: scale(1.03); box-shadow: 0 0 25px red; }
        #status { margin-top: 15px; color: #ff5555; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="devil">😈</div>
        <h1>DEVIL KEY</h1>
        <div class="key-box" id="key">Hdjskakhdbdhfjkfkwkebfbbfi</div>
        <button onclick="copyKey()">COPY KEY</button>
        <div id="status"></div>
    </div>

    <script>
        function copyKey() {
            const key = document.getElementById("key").innerText;
            navigator.clipboard.writeText(key).then(() => {
                document.getElementById("status").innerText = "✓ KEY COPIED SUCCESSFULLY";
            }).catch(() => {
                document.getElementById("status").innerText = "Copy failed!";
            });
        }
    </script>
</body>
</html>
