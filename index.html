<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVIL KEY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#050505;color:#fff;font-family:Arial,sans-serif;
  overflow:hidden;
}
body:before{
  content:"";position:fixed;inset:0;
  background:radial-gradient(circle,#330000 0%,#100000 35%,#050505 75%);
  opacity:.8;z-index:-1;
}
.card{
  width:min(90%,430px);padding:35px 25px;text-align:center;
  background:rgba(15,0,0,.92);border:1px solid #ff2020;
  border-radius:18px;box-shadow:0 0 25px #ff000055, inset 0 0 25px #ff000022;
}
h1{
  color:#ff2020;font-size:32px;letter-spacing:5px;
  text-shadow:0 0 12px #ff0000;margin-bottom:8px;
}
.sub{color:#aaa;margin-bottom:25px;font-size:13px;letter-spacing:2px}
.key{
  padding:17px 12px;margin-bottom:18px;background:#080808;
  border:1px solid #550000;border-radius:10px;color:#ff4444;
  word-break:break-all;font-size:15px;box-shadow:0 0 12px #ff000033;
}
button{
  width:100%;padding:14px;border:0;border-radius:10px;
  background:#d40000;color:#fff;font-size:16px;font-weight:bold;
  letter-spacing:2px;cursor:pointer;transition:.2s;
  box-shadow:0 0 15px #ff000066;
}
button:hover{background:#ff2020;box-shadow:0 0 25px #ff0000aa}
#msg{height:20px;margin-top:14px;color:#ff5555;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>☠ DEVIL KEY ☠</h1>
  <div class="sub">YOUR SECRET KEY</div>
  <div class="key" id="key">Jdjdkakajvdvdjskakdjsjk</div>
  <button onclick="copyKey()">⚡ COPY KEY ⚡</button>
  <div id="msg"></div>
</div>

<script>
function copyKey(){
  const key = document.getElementById("key").innerText;
  navigator.clipboard.writeText(key).then(()=>{
    document.getElementById("msg").innerText="✓ KEY COPIED";
  }).catch(()=>{
    const t=document.createElement("textarea");
    t.value=key;document.body.appendChild(t);t.select();
    document.execCommand("copy");t.remove();
    document.getElementById("msg").innerText="✓ KEY COPIED";
  });
}
</script>
</body>
</html>
